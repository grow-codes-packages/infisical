# Infisical real-service fixture for the grow-codes-packages/infisical SDK (GRO-1369).
#
# - `infisical` : the service under test, image = stack catalog tag (infisical/infisical:v0.167.10),
#                 standalone image (API + UI on 8080), runs DB migrations on start, like the
#                 platform stack template `infisical` (seed gro1285-edge-security-templates.ts).
# - `postgres`  : catalog tag postgres:18.1 (Infisical's database).
# - `valkey`    : catalog tag valkey/valkey:9.1.3 (Infisical's Redis: queues + cache), password set
#                 like the stack's redis-service.
# - `bootstrap` : one-shot (curlimages/curl:8.23.0, the platform's bootstrap image). Does what the
#                 platform's `infisical-bootstrap` job does (POST /api/v1/admin/bootstrap, then
#                 require the admin login) and then prepares the SDK test data: project, extra
#                 environment, folders, tag, Universal Auth + Token Auth machine identities and a
#                 denied identity. Writes KEY=value lines to /bootstrap/env (named volume
#                 `bootstrap`).
#
# No host ports are published. Test containers need only
#   GROW_INFISICAL_URL=http://infisical:8080   and   /bootstrap/env (volume `bootstrap`, read-only).
# Everything here is TEST-ONLY material (static AUTH_SECRET/ENCRYPTION_KEY/DB passwords); the admin
# password and all machine credentials are generated per run by the bootstrap.
#
# Resource needs: ~1.3 GB RAM total (infisical ~1 GB RSS after start), first start 40-90 s
# (migrations); the infisical healthcheck allows up to ~5 min.

services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: infisical-test-only
      POSTGRES_DB: infisical
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infisical -d infisical -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  valkey:
    image: valkey/valkey:9.1.3
    command: ["valkey-server", "--requirepass", "valkey-test-only", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a valkey-test-only --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"

  service:   # service under test (harness contract); reachable as `infisical`
    networks:
      default:
        aliases: [infisical]
    image: infisical/infisical:v0.167.10
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DB_CONNECTION_URI: postgres://infisical:infisical-test-only@postgres:5432/infisical
      REDIS_URL: redis://:valkey-test-only@valkey:6379
      # Test-only keys. ENCRYPTION_KEY = 16 bytes as 32 hex chars (the stack derives it from a
      # per-stack seed with sha256; a static value is equivalent for a disposable fixture).
      AUTH_SECRET: c2RrLXRlc3Qtb25seS1hdXRoLXNlY3JldC0wMDAwMDAwMDA=
      ENCRYPTION_KEY: 5f3d7a1c9e2b4f6a8d0c1e3b5a7f9d2c
      SITE_URL: http://infisical:8080
      TELEMETRY_ENABLED: "false"
      NODE_OPTIONS: --max-old-space-size=1024
    healthcheck:
      # /api/status is public, unauthenticated and exempt from the rate limiter.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/status || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s
    restart: "no"

  bootstrap:
    image: curlimages/curl:8.23.0
    user: "0:0"           # writes to the root-owned named volume; file is chmod 0644 for test users
    depends_on:
      service:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap-scripts/bootstrap.sh"]
    environment:
      INFISICAL_URL: http://infisical:8080
      INFISICAL_ADMIN_EMAIL: admin@sdk-test.invalid
      BOOTSTRAP_ENV_FILE: /bootstrap/env
    volumes:
      - ./bootstrap:/bootstrap-scripts:ro
      - bootstrap:/bootstrap
    restart: "no"

volumes:
  pgdata:
  bootstrap:
